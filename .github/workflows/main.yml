name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zip dosyasını aç (varsa)
        run: |
          if [ ! -f package.json ]; then
            unzip -o ./*.zip -d _unzipped
            APP_DIR=$(dirname "$(find _unzipped -name package.json -not -path '*/node_modules/*' | head -n 1)")
            echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Install and build web
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm run build

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          python3 scripts/setup-android.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RepostPlus-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
